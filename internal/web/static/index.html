<!doctype html>
<html lang = "en">
<head>
<meta charset = "utf-8">
<meta
  name    = "viewport"
  content = "width=device-width, initial-scale=1"
>
<title>armin</title>
<link
  rel  = "icon"
  href = "icon.svg"
  type = "image/svg+xml"
>
<link
  rel  = "stylesheet"
  href = "css/tokens.css"
>
<link
  rel  = "stylesheet"
  href = "css/layout.css"
>
<link
  rel  = "stylesheet"
  href = "css/chat.css"
>
<link
  rel  = "stylesheet"
  href = "css/viewer.css"
>
<link
  rel  = "stylesheet"
  href = "css/md.css"
>
<script
  type = "module"
  src  = "js/main.js"
></script>
</head>
<body>
<header>
  <picture>
    <source
      srcset = "logo.svg"
      media  = "(prefers-color-scheme: dark)"
    >
    <img
      class = "logo"
      src   = "logo-light.svg"
      alt   = "armin"
    >
  </picture>

  <select
    id    = "model"
    title = "pick a model: hosted ones show their price; completion stays local"
  ></select>

  <span
    class = "credits"
    id    = "credits"
  ></span>

  <div
    class = "warning"
    id    = "warning"
  ></div>
</header>

<aside>
  <div
    class = "path"
    data-root
    title = "project root"
  ></div>
  <input
    id          = "filter"
    placeholder = "Filter files"
  >
  <div id = "files"></div>
</aside>

<main>
  <div id = "log">
    <div class = "empty">
      Ask about the project. Click a file on the left to preview it;
      click a <code>file:line</code> in an answer to jump there.
    </div>
  </div>
  <div
    id     = "status"
    hidden
  ></div>
  <form id = "form">
    <div class = "box">
      <textarea
        id          = "input"
        rows        = "1"
        placeholder = "Ask armin…  Enter sends, Shift+Enter adds a line"
      ></textarea>
      <div class = "row">
        <span
          id    = "ctx"
          class = "ctx"
          title = "context used: tokens of the model's window"
        ></span>
        <div class = "dropup">
          <button
            id    = "menu"
            type  = "button"
            class = "ghost icon"
            title = "compact, clear, approve all, viewer"
          >
            <svg
              viewBox         = "0 0 16 16"
              fill            = "none"
              stroke          = "currentColor"
              stroke-width    = "2.4"
              stroke-linecap  = "round"
              stroke-linejoin = "round"
            ><path d = "M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
          </button>
          <div class = "menu">
            <button
              id    = "compact"
              type  = "button"
              title = "summarize older history"
            >Compact history</button>
            <button
              id    = "clear"
              type  = "button"
              title = "start a new conversation"
            >New conversation</button>
            <button
              id    = "approve"
              type  = "button"
              title = "skip the approval prompt for file writes this session"
            >Approve all writes</button>
            <button
              id    = "viewer"
              type  = "button"
              title = "show or hide the file viewer"
            >Toggle viewer</button>
          </div>
        </div>
        <button
          id    = "send"
          class = "primary"
        >Send</button>
      </div>
    </div>
  </form>
</main>

<section>
  <div class = "bar">
    <span id = "ptitle">no file</span>
    <button
      id    = "askfile"
      class = "ghost"
      title = "mention this file in your message"
    >Ask about this file</button>
    <button
      id    = "closeviewer"
      class = "ghost icon"
      title = "hide the file viewer"
    >
      <svg
        viewBox        = "0 0 16 16"
        fill           = "none"
        stroke         = "currentColor"
        stroke-width   = "1.6"
        stroke-linecap = "round"
      ><path d = "M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div id = "preview">
    <div class = "empty">PDFs, Markdown and code preview here.</div>
  </div>
</section>

</body>
</html>
