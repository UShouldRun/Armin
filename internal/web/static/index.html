<!doctype html>
<html lang = "en">
<head>
<meta charset = "utf-8">
<meta
  name    = "viewport"
  content = "width=device-width, initial-scale=1"
>
<title>armin</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #1d1d1f; --dim: #6e6e73;
    --line: #e3e3e6; --accent: #2a6df4; --code: #f2f2f5;
    --add: #e6f6ea; --addt: #146c2e; --del: #fdecec; --delt: #a4161a;
    --hl: #fff4c2;
    --sk: #8a3ffc; --ss: #1f7a3a; --sc: #8e8e93; --sn: #b5561a;
    --st: #0e7c86; --sf: #2a5bd7;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1c1c1f; --text: #e8e8ea; --dim: #9a9aa0;
      --line: #2c2c31; --accent: #6b9bff; --code: #242428;
      --add: #12301c; --addt: #7fd69a; --del: #3a1517; --delt: #f19ca0;
      --hl: #3d3610;
      --sk: #c39bff; --ss: #8fd19e; --sc: #7c7c84; --sn: #f0a868;
      --st: #6cd3dc; --sf: #8ab4ff;
    }
  }

  * { box-sizing: border-box; }
  body.noviewer { grid-template-columns: 260px 1fr; }
  body.noviewer section { display: none; }
  .bar .close { border: 0; background: none; color: var(--dim); font-size: 16px; padding: 0 4px; }
  .k { color: var(--sk); }
  .s { color: var(--ss); }
  .c { color: var(--sc); font-style: italic; }
  .num { color: var(--sn); }
  .t { color: var(--st); }
  .f { color: var(--sf); }
  body {
    margin: 0; height: 100vh; display: grid;
    grid-template-columns: 260px 1fr 42%;
    grid-template-rows: auto 1fr;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, sans-serif;
  }

  header {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }

  header b { font-size: 15px; }
  header .credits { color: var(--dim); font-size: 12px; white-space: nowrap; }
  header .credits.low { color: var(--delt); }
  header .warning {
    flex-basis: 100%; padding: 4px 9px; border-radius: 6px;
    background: var(--hl); color: var(--text); font-size: 13px;
  }
  header .warning:empty { display: none; }
  header .root { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  header select, header button, .bar button, .approve button {
    font: inherit; padding: 3px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer;
  }

  .meter { width: 120px; height: 8px; background: var(--code); border-radius: 4px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); width: 0; }
  #ctx { color: var(--dim); font-size: 12px; min-width: 150px; }

  aside, main, section { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  aside { border-right: 1px solid var(--line); background: var(--panel); }
  aside input { margin: 8px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  #files { overflow: auto; flex: 1; padding: 0 4px 8px; font: 12px ui-monospace, monospace; }
  #files div { padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #files div:hover, #files div.on { background: var(--code); }

  #log { flex: 1; overflow: auto; padding: 16px 20px; }
  .msg { margin: 0 0 16px; }
  .msg.user { background: var(--code); padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
  .tool, .notice { color: var(--dim); font: 12px ui-monospace, monospace; margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
  .tool b { color: var(--text); }
  .tool .dot { color: var(--accent); }
  .tool.result { padding-left: 14px; }
  .tool.err { padding-left: 14px; color: var(--delt); }
  .notice { color: var(--accent); }
  .err { color: var(--delt); }
  details.think { color: var(--dim); margin: 4px 0; font-size: 13px; }
  details.think summary { cursor: pointer; }
  details.trace { margin: 4px 0; font-size: 13px; }
  details.trace summary { cursor: pointer; color: var(--dim); }
  details.trace pre { margin: 4px 0; color: var(--dim); white-space: pre-wrap; }
  details.think div { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 8px; }
  .approve { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; background: var(--panel); }
  .approve pre { margin: 6px 0; max-height: 320px; overflow: auto; font-size: 12px; }
  .approve .add { background: var(--add); color: var(--addt); display: block; }
  .approve .del { background: var(--del); color: var(--delt); display: block; }
  .approve input { width: 60%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  #status { padding: 4px 20px; color: var(--dim); font: 12px ui-monospace, monospace; border-top: 1px solid var(--line); }
  #status::before { content: "●"; color: var(--accent); margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
  #status.stall::before, #status.stall { color: #d4a017; }
  #status.lost::before, #status.lost { color: var(--delt); }
  @keyframes pulse { 50% { opacity: .25; } }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; height: 64px; padding: 8px; font: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }

  form button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  form button:disabled { opacity: .5; }

  section { border-left: 1px solid var(--line); background: var(--panel); }
  .bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .bar span { flex: 1; font: 12px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview { flex: 1; overflow: auto; }
  #preview iframe { width: 100%; height: 100%; border: 0; }
  #preview img { max-width: 100%; display: block; margin: 12px auto; }
  #preview .md { padding: 4px 18px; }
  table.code { border-collapse: collapse; font: 12px/1.45 ui-monospace, monospace; width: 100%; }
  table.code td { padding: 0 8px; white-space: pre; vertical-align: top; }
  table.code td.n { color: var(--dim); text-align: right; user-select: none; border-right: 1px solid var(--line); width: 1%; }
  table.code tr.hl td { background: var(--hl); }
  table.code tr.add td { background: var(--add); }
  table.code tr.del td { background: var(--del); }
  table.code tr.add td.n, table.code tr.del td.n { color: var(--text); }
  .approve .view { font: 12px ui-monospace, monospace; color: var(--accent); cursor: pointer; margin: 4px 0; }
  .empty { color: var(--dim); padding: 24px; }

  .md pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; font-size: 12.5px; }
  .md code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 3px 8px; }
  .md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .md a { color: var(--accent); }
  .md a.ref { text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
    aside { max-height: 160px; }
    section { min-height: 300px; border-left: 0; border-top: 1px solid var(--line); }
    body.noviewer { grid-template-columns: 1fr; }
  }

</style>
</head>
<body>
<header>
  <b>armin</b>
  <span
    class = "root"
    id    = "root"
  ></span>

  <select
    id    = "model"
    title = "pick a model — hosted ones show their price; completion stays local"
  ></select>

  <span
    class = "credits"
    id    = "credits"
  ></span>

  <div
    class = "meter"
    title = "context used"
  >
    <div id = "meter"></div>
  </div>

  <span id = "ctx"></span>

  <button
    id    = "compact"
    title = "summarize older history"
  >compact</button>

  <button
    id    = "clear"
    title = "start a new conversation"
  >clear</button>

  <button
    id    = "viewer"
    title = "show or hide the file viewer"
  >viewer</button>

  <div
    class = "warning"
    id    = "warning"
  ></div>
</header>

<aside>
  <input
    id          = "filter"
    placeholder = "filter files…"
  >
  <div id = "files"></div>
</aside>

<main>
  <div id = "log"><div class = "empty">Ask about the project. Click a file on the left to preview it; click a <code>file:line</code> in an answer to jump there.</div></div>
  <div id = "status" hidden></div>
  <form id = "form">
    <textarea
      id          = "input"
      placeholder = "Message (Enter to send, Shift+Enter for a new line)"
    ></textarea>
    <button id = "send">Send</button>
  </form>
</main>

<section>
  <div class = "bar">
    <span id = "ptitle">no file</span>
    <button
      id    = "askfile"
      title = "mention this file in your message"
    >ask about this file</button>

    <button
      id    = "closeviewer"
      class = "close"
      title = "hide the file viewer"
    >×</button>
  </div>
  <div id = "preview"><div class = "empty">PDFs, Markdown and code preview here.</div></div>
</section>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
let files    = [];
let current  = null;
let busy     = false;

// ---------- helpers ----------

const escapes = {
  "&":  "&amp;",
  "<":  "&lt;",
  ">":  "&gt;",
  "\"": "&quot;",
  "'":  "&#39;",
};

const esc = (s) => s.replace(/[&<>"']/g, (c) => escapes[c]);

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify(body),
  };

  const res = await fetch(path, opts);
  if (!res.ok) {
    throw new Error((await res.text()).trim() || res.statusText);
  }

  return res.headers.get("Content-Type")?.includes("json") ? res.json() : res.text();
}

// ---------- markdown (small, safe: escape first, then build) ----------

const fileRef = /(^|[\s(`\[])((?:[\w.-]+\/)*[\w.-]+\.[A-Za-z0-9]{1,8}):(\d+)(?:-(\d+))?/g;

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return "\u0000" + (codes.length - 1) + "\u0000";
  });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href = "${ u }" target = "_blank" rel = "noopener">${ t }</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  s = s.replace(fileRef, (m, pre, path, line) => files.includes(path) || files.some((f) => f.endsWith("/" + path))
    ? `${ pre }<a class = "ref" data-path = "${ path }" data-line = "${ line }">${ m.slice(pre.length) }</a>`
    : m);

  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => {
    const c = codes[+i];
    const ref = c.match(/^((?:[\w.-]+\/)*[\w.-]+\.[A-Za-z0-9]{1,8}):(\d+)/);

    return ref ? `<a class = "ref" data-path = "${ esc(ref[1]) }" data-line = "${ ref[2] }"><code>${ esc(c) }</code></a>`
               : `<code>${ esc(c) }</code>`;
  });
}

function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  const out   = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^```(\S*)/);
    if (fence) {
      const body = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) {
        body.push(lines[i]);
      }

      i++;
      out.push(`<pre><code>${ esc(body.join("\n")) }</code></pre>`);
      continue;
    }

    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h) {
      out.push(`<h${ h[1].length }>${ inline(h[2]) }</h${ h[1].length }>`);
      i++;
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const row = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      let t = "<table><tr>" + row(l).map((c) => `<th>${ inline(c) }</th>`).join("") + "</tr>";
      for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) {
        t += "<tr>" + row(lines[i]).map((c) => `<td>${ inline(c) }</td>`).join("") + "</tr>";
      }

      out.push(t + "</table>");
      continue;
    }

    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      const items   = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) {
        items.push(`<li>${ inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")) }</li>`);
      }

      out.push(ordered ? `<ol>${ items.join("") }</ol>` : `<ul>${ items.join("") }</ul>`);
      continue;
    }

    if (/^>\s?/.test(l)) {
      const q = [];
      for (; i < lines.length && /^>\s?/.test(lines[i]); i++) {
        q.push(lines[i].replace(/^>\s?/, ""));
      }

      out.push(`<blockquote>${ inline(q.join(" ")) }</blockquote>`);
      continue;
    }

    if (l.trim() === "") {
      i++;
      continue;
    }

    const p = [];
    for (; i < lines.length && lines[i].trim() !== "" && !/^(```|#{1,6}\s|>|\s*([-*]|\d+\.)\s)/.test(lines[i]); i++) {
      p.push(lines[i]);
    }
    out.push(`<p>${ inline(p.join("\n")).replace(/\n/g, "<br>") }</p>`);
  }
  return out.join("\n");
}

// ---------- header / files ----------

async function refreshInfo() {
  const info = await api("/api/info");
  $("root").textContent = info.root;
  const sel = $("model");
  const models = info.models || [ { name: info.model, model: info.label } ];
  const sugg   = (info.hosted && info.suggested) || [];
  const key    = models.map((m) => m.name).join(",") + "|" + sugg.map((m) => m.id).join(",");
  if (sel.dataset.models !== key) {
    const option = (value, label) => `<option value = "${ esc(value) }">${ esc(label) }</option>`;
    const mine   = models.map((m) => {
      let label = m.model && m.model !== m.name ? `${ m.name } — ${ m.model }` : m.name;
      label += m.cost ? ` · ${ costLabel(m.cost) }` : m.model && m.model.includes("/") ? " · hosted" : " · local, free";
      return option(m.name, label);
    }).join("");
    const known  = new Set(models.map((m) => m.name));
    const hosted = sugg.filter((m) => !known.has(info.hosted + ":" + m.id))
      .map((m) => option(info.hosted + ":" + m.id, `${ m.id } · ${ costLabel(m) }`)).join("");
    sel.innerHTML = `<optgroup label = "configured">${ mine }</optgroup>`
      + (hosted ? `<optgroup label = "suggested on OpenRouter (uses ${ esc(info.hosted) }'s key)">${ hosted }</optgroup>` : "");
    sel.dataset.models = key;
  }
  sel.value = info.model;

  const credits = $("credits");
  const b       = info.balance;
  if (b) {
    const left = b.credits - b.used;
    credits.textContent = `OpenRouter $${ left.toFixed(2) } left · today $${ (b.today || 0).toFixed(2) }`;
    credits.title       = b.key_limit ? `this key: $${ b.key_left.toFixed(2) } of its $${ b.key_limit.toFixed(2) } cap left` : "";
    credits.classList.toggle("low", left < 1);
  } else {
    credits.textContent = "";
  }
  $("warning").textContent = info.warning ? "⚠ " + info.warning : "";
  showContext(info.tokens || info.approx, info.window, info.tier, !info.tokens);
}

// costLabel is a hosted model's price per 1M tokens in / out, and a
// deep session (~1.2M in, 30k out, as armin runs one).
const costLabel = (c) => !c.in && !c.out ? "free"
  : `$${ c.in.toFixed(2) } / $${ c.out.toFixed(2) } per 1M · ~$${ c.session.toFixed(2) } a session`;

// kTokens renders a token count compactly: 950, 8.4k, 96k.
const kTokens = (n) => n < 1000 ? String(n) : n < 10000 ? (n / 1000).toFixed(1) + "k" : Math.round(n / 1000) + "k";

// showContext fills the header gauge: used / window, the share, and
// the tier; yellow past half, red where compaction starts (75%).
function showContext(used, window, tier, estimate) {
  const pct  = window ? Math.min(100, Math.round(used * 100 / window)) : 0;
  const mark = estimate ? "~" : "";
  const bar  = $("meter");

  bar.style.width      = pct + "%";
  bar.style.background = pct >= 75 ? "var(--delt)" : pct >= 50 ? "#d4a017" : "var(--accent)";

  $("ctx").textContent = window
    ? `${ mark }${ kTokens(used) } / ${ kTokens(window) } · ${ pct }%${ tier ? " · " + tier : "" }`
    : `${ mark }${ kTokens(used) } tokens`;
}

async function loadFiles() {
  try {
    files = await api("/api/files");
    renderFiles();

  } catch (e) {
    console.error("[ERROR]: loadFiles - ", e);
  }
}

// Tools that create or change files: after one succeeds, the file
// list reloads, and so does the preview when it shows what changed.
const changers = [ "write_file", "edit_file", "run_program" ];
let   reloadTimer = null;

function filesChanged(call) {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    await loadFiles();
    if (!current) return;

    const path = call.args?.path || "";
    const same = path && (path === current || path.endsWith("/" + current) || current.endsWith("/" + path));
    if (same || call.name === "run_program") preview(current, null, true);
  }, 150);
}

function renderFiles() {
  const q    = $("filter").value.toLowerCase();
  const list = files.filter((f) => f.toLowerCase().includes(q)).slice(0, 800);
  $("files").innerHTML = list.map((f) => `<div data-path = "${ esc(f) }" class = "${ f === current ? "on" : "" }" title = "${ esc(f) }">${ esc(f) }</div>`).join("");
}

// ---------- file viewer ----------

// The viewer opens with a file and closes on × or "viewer"; the
// choice is remembered per browser.
function showViewer(on) {
  document.body.classList.toggle("noviewer", !on);
  try {
    localStorage.setItem("armin.viewer", on ? "1" : "0");

  } catch (e) {
    // storage blocked: the toggle still works for this page
  }
}

function viewerOpen() { return !document.body.classList.contains("noviewer"); }

// ---------- syntax highlighting ----------

// A small tokenizer per language family: comments, strings,
// numbers, keywords, types and calls. Enough to read code by, with
// no library behind it.
const words = (s) => new Set(s.split(" "));

const cLike = {
  line:  "//",
  block: [ "/*", "*/" ],
  quote: "\"'`",
};

const langs = {
  go: { ...cLike,
    kw:    words("break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var"),
    lit:   words("true false nil iota"),
    types: words("bool byte complex64 complex128 error float32 float64 int int8 int16 int32 int64 rune string uint uint8 uint16 uint32 uint64 uintptr any"),
  },
  js: { ...cLike,
    kw:    words("async await break case catch class const continue debugger default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while with yield interface type enum implements"),
    lit:   words("true false null undefined NaN Infinity"),
    types: words("string number boolean any unknown never object void"),
  },
  c: { ...cLike, quote: "\"'",
    kw:    words("break case const continue default do else enum extern for goto if inline register restrict return sizeof static struct switch typedef union volatile while class namespace template typename public private protected virtual override constexpr noexcept using new delete auto #include #define #ifndef #ifdef #endif #if #else #pragma"),
    lit:   words("true false NULL nullptr"),
    types: words("void char short int long float double signed unsigned bool size_t u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 uint8_t uint16_t uint32_t uint64_t int8_t int16_t int32_t int64_t"),
  },
  rs: { ...cLike, quote: "\"",
    kw:    words("as async await break const continue crate dyn else enum extern fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait type unsafe use where while"),
    lit:   words("true false None Some Ok Err"),
    types: words("i8 i16 i32 i64 i128 isize u8 u16 u32 u64 u128 usize f32 f64 bool char str String Vec Option Result Box"),
  },
  java: { ...cLike, quote: "\"'",
    kw:    words("abstract break case catch class continue default do else enum extends final finally for if implements import instanceof interface new package private protected public return static super switch this throw throws try void while var record"),
    lit:   words("true false null"),
    types: words("int long short byte char boolean float double String Object"),
  },
  py: {
    line:  "#",
    quote: "\"'",
    kw:    words("and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case"),
    lit:   words("True False None self"),
    types: words("int float str bytes bool list dict set tuple object"),
  },
  sh: {
    line:  "#",
    quote: "\"'`",
    kw:    words("if then else elif fi for while until do done case esac in function return local export readonly set unset shift exit source alias"),
    lit:   words("true false"),
    types: words(""),
  },
  lua: {
    line:  "--",
    block: [ "--[[", "]]" ],
    quote: "\"'",
    kw:    words("and break do else elseif end for function goto if in local not or repeat return then until while"),
    lit:   words("true false nil"),
    types: words(""),
  },
  sql: {
    line:  "--",
    block: [ "/*", "*/" ],
    quote: "'\"",
    kw:    words("select from where insert into values update set delete create table index view drop alter add join left right inner outer on group by order having limit offset as and or not null is in exists distinct union all primary key foreign references default unique check begin commit rollback with returning case when then else end"),
    lit:   words("true false"),
    types: words("int integer bigint smallint text varchar char boolean date timestamp timestamptz numeric real serial uuid jsonb json bytea"),
    fold:  true,
  },
  typ: { ...cLike, quote: "\"",
    kw:    words("let set show import include if else for in while return context"),
    lit:   words("true false none auto"),
    types: words(""),
  },
  json: {
    quote: "\"",
    kw:    words(""),
    lit:   words("true false null"),
    types: words(""),
  },
};

const byExt = {
  go: "go", js: "js", mjs: "js", cjs: "js", jsx: "js", ts: "js", tsx: "js",
  c: "c", h: "c", cc: "c", cpp: "c", cxx: "c", hpp: "c", hh: "c", inl: "c",
  rs: "rs", java: "java", kt: "java", py: "py", sh: "sh", bash: "sh",
  zsh: "sh", lua: "lua", sql: "sql", typ: "typ", json: "json",
};

// highlightMax: bigger files show plain, fast.
const highlightMax = 300000;

// highlight returns the text as HTML lines, spans closed and
// reopened at each line break so a block comment or string spanning
// lines stays colored in every table row.
function highlight(text, ext) {
  const lang = langs[byExt[ext]];
  if (!lang || text.length > highlightMax) {
    return text.split("\n").map(esc);
  }

  const out  = [];
  let   line = "";
  const put  = (cls, tok) => {
    const parts = tok.split("\n");
    parts.forEach((p, i) => {
      if (i > 0) {
        out.push(line);
        line = "";
      }

      if (p !== "") {
        line += cls ? `<span class = "${ cls }">${ esc(p) }</span>` : esc(p);
      }
    });
  };

  let i = 0;
  const n = text.length;
  while (i < n) {
    const ch = text[i];

    if (lang.block && text.startsWith(lang.block[0], i)) {
      let end = text.indexOf(lang.block[1], i + lang.block[0].length);
      end = end < 0 ? n : end + lang.block[1].length;
      put("c", text.slice(i, end));
      i = end;
      continue;
    }

    if (lang.line && text.startsWith(lang.line, i)) {
      let end = text.indexOf("\n", i);
      end = end < 0 ? n : end;
      put("c", text.slice(i, end));
      i = end;
      continue;
    }

    if (lang.quote && lang.quote.includes(ch)) {
      const triple = ch.repeat(3);
      const long   = byExt[ext] === "py" && text.startsWith(triple, i);
      const close  = long ? triple : ch;
      let   j      = i + close.length;
      while (j < n && !text.startsWith(close, j)) {
        if (text[j] === "\\" && ch !== "`") j++;
        if (text[j] === "\n" && !long && ch !== "`") break;
        j++;
      }

      j = Math.min(n, j + close.length);
      put("s", text.slice(i, j));
      i = j;
      continue;
    }

    if (/[0-9]/.test(ch) && !/[\w]/.test(text[i - 1] || "")) {
      const m = /^(0x[0-9a-fA-F_]+|0b[01_]+|[0-9][0-9_]*(\.[0-9_]+)?([eE][+-]?[0-9]+)?)/.exec(text.slice(i, i + 40));
      put("num", m[0]);
      i += m[0].length;
      continue;
    }

    const directive = ch === "#" && /[A-Za-z]/.test(text[i + 1] || "");
    if (/[A-Za-z_]/.test(ch) || directive) {
      const m    = /^#?[A-Za-z_][\w]*/.exec(text.slice(i, i + 80));
      const word = m[0];
      const key  = lang.fold ? word.toLowerCase() : word;
      let   cls  = "";
      if (lang.kw.has(key)) {
        cls = "k";
      } else if (lang.lit.has(key)) {
        cls = "num";
      } else if (lang.types.has(key)) {
        cls = "t";
      } else if (/^\s*\(/.test(text.slice(i + word.length, i + word.length + 4))) {
        cls = "f";
      } else if (byExt[ext] === "go" && /^[A-Z]/.test(word) && text[i - 1] !== ".") {
        cls = "t";
      }

      put(cls, word);
      i += word.length;
      continue;
    }

    put("", ch);
    i++;
  }

  out.push(line);

  return out;
}

// ---------- preview ----------

const images = [ "png", "jpg", "jpeg", "gif", "webp", "svg" ];

async function preview(path, line, keepScroll) {
  showViewer(true);
  const full = files.includes(path) ? path : (files.find((f) => f.endsWith("/" + path)) || path);
  const top  = keepScroll ? $("preview").scrollTop : 0;
  current = full;
  renderFiles();
  $("ptitle").textContent = full + (line ? `:${ line }` : "");
  const ext = full.split(".").pop().toLowerCase();
  const url = "/api/raw?path=" + encodeURIComponent(full);
  const box = $("preview");

  if (ext === "pdf") {
    box.innerHTML = `<iframe src = "${ url }"></iframe>`;
    return;
  }
  if (images.includes(ext)) {
    box.innerHTML = `<img src = "${ url }" alt = "${ esc(full) }">`;
    return;
  }
  try {
    const text = await api(url);
    if ((ext === "md" || ext === "markdown") && !line) {
      box.innerHTML = `<div class = "md">${ markdown(text) }</div>`;
      return;
    }
    const rows = highlight(text, ext).map((l, n) => `<tr id = "L${ n + 1 }"${ line && n + 1 === +line ? " class = \"hl\"" : "" }><td class = "n">${ n + 1 }</td><td>${ l || " " }</td></tr>`);
    box.innerHTML = `<table class = "code">${ rows.join("") }</table>`;
    if (line) {
      document.getElementById("L" + line)?.scrollIntoView({ block: "center" });
    } else {
      box.scrollTop = top;
    }

  } catch (e) {
    box.innerHTML = `<div class = "empty err">${ esc(e.message) }</div>`;
  }
}

// ---------- chat ----------

function add(cls, html) {
  const log = $("log");
  log.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = cls;
  el.innerHTML = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// What each kind of approval asks, and its buttons.
const approvalText = {
  edit:           { what: "wants to change a file:", yes: "Apply", done: "applied" },
  run_program:    { what: "wants to run:", yes: "Run", done: "ran" },
  "run_program (privileged)": { what: "wants to run a privileged command:", yes: "Run", done: "ran" },
  request_access: { what: "wants to read outside the project:", yes: "Grant", done: "granted" },
};

// parseChange reads an edit's preview (see tools.Change.Preview):
// "path @ line N" or "new file path (N lines)", then "- ", "+ " and
// "  " context lines. Null for anything else (a command, a
// directory), and for a capped preview, which the viewer can't place.
function parseChange(preview) {
  const lines  = preview.replace(/\n$/, "").split("\n");
  const at     = /^(.+) @ line (\d+)$/.exec(lines[0]);
  const fresh  = /^new file (.+) \(\d+ lines\)$/.exec(lines[0]);
  if (!at && !fresh) return null;

  const ch = {
    path: (at || fresh)[1], start: at ? +at[2] : 1, created: !!fresh,
    before: 0, gone: [], came: [],
  };
  for (const l of lines.slice(1)) {
    if (l.startsWith("… (")) return null;
    if (l.startsWith("- ")) ch.gone.push(l.slice(2));
    else if (l.startsWith("+ ")) ch.came.push(l.slice(2));
    else if (!ch.gone.length && !ch.came.length) ch.before++;
  }

  return ch;
}

// showChange shows a proposed edit in the file viewer: the whole
// file, highlighted, the removed lines in red where they are and the
// new ones in green right after, scrolled into view.
async function showChange(ch) {
  showViewer(true);
  current = ch.path;
  renderFiles();
  $("ptitle").textContent = ch.path + " — proposed change";

  const ext  = ch.path.split(".").pop().toLowerCase();
  const box  = $("preview");
  const row  = (cls, n, html) => `<tr${ cls ? ` class = "${ cls }"` : "" }><td class = "n">${ n }</td><td>${ html || " " }</td></tr>`;
  const came = highlight(ch.came.join("\n"), ext);

  if (ch.created) {
    box.innerHTML = `<table class = "code">${ came.map((l, i) => row("add", i + 1, l)).join("") }</table>`;
    return;
  }

  let text = "";
  try {
    text = await api("/api/raw?path=" + encodeURIComponent(ch.path));

  } catch (e) {
    box.innerHTML = `<div class = "empty err">${ esc(e.message) }</div>`;
    return;
  }

  const file  = highlight(text, ext);
  const first = ch.start - 1; // the first changed line, 0-based
  const rows  = [];
  for (let i = 0; i < first && i < file.length; i++) rows.push(row("", i + 1, file[i]));
  for (let i = 0; i < ch.gone.length; i++) rows.push(row("del", first + i + 1, file[first + i]));
  came.forEach((l, i) => rows.push(row("add", "+", l)));
  for (let i = first + ch.gone.length; i < file.length; i++) rows.push(row("", i + 1, file[i]));

  box.innerHTML = `<table class = "code">${ rows.join("") }</table>`;
  box.querySelector("tr.del, tr.add")?.scrollIntoView({ block: "center" });
}

function approvalBox(ev) {
  const change = parseChange(ev.preview);
  const lines  = ev.preview.split("\n").map((l) => {
    if (l.startsWith("+ ")) return `<span class = "add">${ esc(l) }</span>`;
    if (l.startsWith("- ")) return `<span class = "del">${ esc(l) }</span>`;
    return esc(l);
  });
  const ask  = approvalText[ev.tool] || approvalText.edit;
  const body = change
    ? `<div class = "view">${ esc(ev.preview.split("\n")[0]) } — shown in the viewer (click to show again)</div>`
    : `<pre>${ lines.join("\n") }</pre>`;
  if (change) showChange(change);

  const box = add("approve", `<div><b>${ esc(ev.tool) }</b> ${ ask.what }</div>
    ${ body }
    <button data-ok = "1">${ ask.yes }</button> <button data-ok = "0">Decline</button>
    <input placeholder = "or tell the model what to do instead">`);
  box.addEventListener("click", async (e) => {
    if (change && e.target.classList.contains("view")) {
      showChange(change);
      return;
    }

    if (!e.target.dataset.ok) return;
    const ok       = e.target.dataset.ok === "1";
    const feedback = box.querySelector("input").value;
    await api("/api/approve", { id: ev.id, ok: ok && !feedback, feedback });
    box.querySelectorAll("button, input").forEach((b) => b.disabled = true);
    box.insertAdjacentHTML("beforeend", `<div class = "tool">${ ok && !feedback ? ask.done : "declined" }</div>`);
  });
}

// ---------- status ----------

// What the turn is doing, for the status bar: the phase, since when,
// the last sign of life from the model and from armin itself.
const stallAfter = 20000; // ms of model silence before it says so
const lostAfter  = 15000; // ms without armin's 5 s heartbeat

const st = { phase: "", since: 0, last: 0, heard: 0, watch: false, count: 0 };

function since(t) {
  const s = Math.round((Date.now() - t) / 1000);
  return s < 60 ? `${ s }s` : `${ Math.floor(s / 60) }m${ String(s % 60).padStart(2, "0") }s`;
}

function setPhase(phase, watch) {
  const now = Date.now();
  Object.assign(st, { phase, since: now, last: now, heard: now, watch, count: 0 });
  renderStatus();
}

function renderStatus() {
  const bar = $("status");
  const now = Date.now();
  let text  = st.phase;
  if (st.count) text += ` · ${ st.count } tokens`;
  text += " · " + since(st.since);
  if (st.phase === "waiting for the model" && now - st.since > 5000) text += " (it may be loading or busy)";

  let cls = "";
  if (st.watch && now - st.last > stallAfter) {
    text += " · nothing from the model for " + since(st.last);
    cls   = "stall";
  }
  if (now - st.heard > lostAfter) {
    text = `no word from armin for ${ since(st.heard) } · the connection may be lost (is armin still running?)`;
    cls  = "lost";
  }

  bar.textContent = text;
  bar.className   = cls;
}

async function send(text) {
  busy = true;
  $("send").disabled = true;
  add("msg user", esc(text));

  let answer = "", thoughts = "", think = null, msg = null, pending = false;
  let lastCall = null;

  setPhase("waiting for the model", true);
  $("status").hidden = false;
  const ticker = setInterval(renderStatus, 500);
  const paint = () => {
    pending = false;
    if (msg) msg.innerHTML = markdown(answer);
    if (think) think.querySelector("div").textContent = thoughts;
    $("log").scrollTop = $("log").scrollHeight;
  };
  const schedule = () => {
    if (!pending) { pending = true; requestAnimationFrame(paint); }
  };
  const handle = (kind, data) => {
    st.heard = Date.now();
    switch (kind) {
    case "ping":
      break;
    case "progress":
      if (!st.phase.startsWith("reading the prompt")) setPhase("", true);
      st.phase = `reading the prompt ${ kTokens(data.done) }/${ kTokens(data.total) }`;
      st.last  = Date.now();
      break;
    case "reasoning":
      if (st.phase !== "thinking") setPhase("thinking", true);
      st.count++;
      st.last = Date.now();
      if (!think) {
        think = document.createElement("details");
        think.className = "think";
        think.innerHTML = "<summary>thinking</summary><div></div>";
        $("log").querySelector(".empty")?.remove();
        $("log").appendChild(think);
      }
      thoughts += data;
      schedule();
      break;
    case "token":
      if (st.phase !== "writing") setPhase("writing", true);
      st.count++;
      st.last = Date.now();
      if (!msg) msg = add("msg md", "");
      answer += data;
      schedule();
      break;
    case "tool": {
      const line = data.line || data.name;
      const cut  = line.indexOf("  ");
      const name = cut < 0 ? line : line.slice(0, cut);
      const rest = cut < 0 ? "" : line.slice(cut + 2);
      add("tool", `<span class = "dot">●</span> <b>${ esc(name) }</b>  ${ esc(rest) }`);
      msg = null; answer = ""; think = null; thoughts = "";
      lastCall = data;
      setPhase("running " + (data.args?.binary || data.name), false);
      break;
    }

    case "result":
      setPhase("waiting for the model", true);
      add(data.startsWith("error:") ? "tool err" : "tool result", "└ " + esc(data));
      if (!data.startsWith("error:") && lastCall && changers.includes(lastCall.name)) {
        filesChanged(lastCall);
      }

      break;
    case "notice":
      add("notice", "context: " + esc(data));
      break;

    case "usage":
      showContext(data.tokens, data.window, data.tier, false);
      break;
    case "approve":
      setPhase("waiting for your approval", false);
      approvalBox(data);
      break;
    case "error": {
      // {message, trace} from the server, or a plain string (the
      // fetch failed before the stream started)
      const m = typeof data === "string" ? { message: data, trace: "" } : data;
      const div = add("msg err", esc(m.message));
      if (m.trace) {
        const d = document.createElement("details");
        d.className = "trace";
        d.innerHTML = "<summary>trace</summary>";
        const pre = document.createElement("pre");
        pre.textContent = m.trace;
        d.appendChild(pre);
        div.appendChild(d);
      }
      break;
    }
    case "done":
      if (!msg && data) { msg = add("msg md", ""); answer = data; }
      else if (data) answer = data;
      paint();
      break;
    }
  };

  try {
    const res = await fetch("/api/chat", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error((await res.text()).trim());
    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, cut);
        buf = buf.slice(cut + 2);
        const kind = block.match(/^event: (.*)$/m)?.[1];
        const data = block.match(/^data: (.*)$/m)?.[1];
        if (kind && data !== undefined) handle(kind, JSON.parse(data));
      }
    }

  } catch (e) {
    console.error("[ERROR]: send - ", e);
    add("msg err", esc(e.message));

  } finally {
    clearInterval(ticker);
    $("status").hidden = true;
    busy = false;
    $("send").disabled = false;
    refreshInfo();
    loadFiles();
  }
}

// ---------- wiring ----------

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  send(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});
$("filter").addEventListener("input", renderFiles);
$("files").addEventListener("click", (e) => {
  if (e.target.dataset.path) preview(e.target.dataset.path);
});
$("log").addEventListener("click", (e) => {
  const ref = e.target.closest("a.ref");
  if (ref) preview(ref.dataset.path, ref.dataset.line);
});
$("askfile").addEventListener("click", () => {
  if (!current) return;
  $("input").value = `About \`${ current }\`: ` + $("input").value;
  $("input").focus();
});
$("model").addEventListener("change", async (e) => {
  try {
    const r = await api("/api/command", { name: "model", arg: e.target.value });
    add("notice", esc(r.result));

  } catch (err) {
    console.error("[ERROR]: switchModel - ", err);
    add("msg err", esc(err.message));
  }
  refreshInfo();
});
for (const name of [ "clear", "compact" ]) {
  $(name).addEventListener("click", async () => {
    if (busy) return;
    try {
      const r = await api("/api/command", { name });
      if (name === "clear") $("log").innerHTML = "";
      add("notice", esc(r.result));

    } catch (err) {
      console.error(`[ERROR]: ${ name } - `, err);
      add("msg err", esc(err.message));
    }
    refreshInfo();
  });
}

// Files changed outside armin (an editor, a terminal) show up when
// you come back to the tab.
window.addEventListener("focus", () => { if (!busy) loadFiles(); });

$("viewer").addEventListener("click", () => showViewer(!viewerOpen()));
$("closeviewer").addEventListener("click", () => showViewer(false));

try {
  if (localStorage.getItem("armin.viewer") === "0") {
    showViewer(false);
  }

} catch (e) {
  // storage blocked: the viewer starts open
}

// A resumed session shows what was said before.
async function loadHistory() {
  try {
    const h = await api("/api/history");
    for (const e of h.entries) {
      if (e.role === "user") add("msg user", esc(e.text));
      else if (e.role === "assistant") add("msg md", markdown(e.text));
      else {
        const cut = e.text.indexOf("  ");
        const name = cut < 0 ? e.text : e.text.slice(0, cut);
        const rest = cut < 0 ? "" : e.text.slice(cut + 2);
        add("tool", `<span class = "dot">●</span> <b>${ esc(name) }</b>  ${ esc(rest) }`);
      }
    }

    if (h.entries.length) add("notice", `resumed session: ${ esc(h.title || "untitled") } (${ esc(h.id.split("-")[0]) })`);
    $("log").scrollTop = $("log").scrollHeight;

  } catch (e) {
    console.error("[ERROR]: loadHistory - ", e);
  }
}

loadFiles();
loadHistory();
refreshInfo();
</script>
