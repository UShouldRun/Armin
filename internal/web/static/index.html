<!doctype html>
<html lang = "en">
<head>
<meta charset = "utf-8">
<meta
  name    = "viewport"
  content = "width=device-width, initial-scale=1"
>
<title>armin</title>
<link
  rel  = "icon"
  href = "icon.svg"
  type = "image/svg+xml"
>
<link
  rel  = "stylesheet"
  href = "css/tokens.css"
>
<link
  rel  = "stylesheet"
  href = "css/layout.css"
>
<link
  rel  = "stylesheet"
  href = "css/chat.css"
>
<link
  rel  = "stylesheet"
  href = "css/viewer.css"
>
<link
  rel  = "stylesheet"
  href = "css/md.css"
>
<script
  type = "module"
  src  = "js/main.js"
></script>
</head>
<body>
<header>
  <img
    class = "logo"
    src   = "logo.svg"
    alt   = ""
  >

  <select
    id    = "model"
    title = "pick a model: hosted ones show their price; completion stays local"
  ></select>

  <span
    class = "credits"
    id    = "credits"
  ></span>

  <div
    class = "warning"
    id    = "warning"
  ></div>
</header>

<aside>
  <div
    class = "path"
    data-root
    title = "project root"
  ></div>
  <input
    id          = "filter"
    placeholder = "filter files…"
  >
  <div id = "files"></div>
</aside>

<main>
  <div id = "log"><div class = "empty">Ask about the project. Click a file on the left to preview it; click a <code>file:line</code> in an answer to jump there.</div></div>
  <div id = "status" hidden></div>
  <form id = "form">
    <span
      id    = "ctx"
      class = "ctx"
      title = "context used: tokens of the model's window"
    ></span>
    <textarea
      id          = "input"
      placeholder = "Message (Enter to send, Shift+Enter for a new line)"
    ></textarea>
    <button id = "send">Send</button>
    <div class = "dropup">
      <button
        id    = "menu"
        type  = "button"
        title = "compact, clear, approve all, viewer"
      >↑</button>
      <div class = "menu">
        <button
          id    = "compact"
          type  = "button"
          title = "summarize older history"
        >compact</button>
        <button
          id    = "clear"
          type  = "button"
          title = "start a new conversation"
        >clear</button>
        <button
          id    = "approve"
          type  = "button"
          title = "skip the approval prompt for file writes this session"
        >approve all</button>
        <button
          id    = "viewer"
          type  = "button"
          title = "show or hide the file viewer"
        >viewer</button>
      </div>
    </div>
  </form>
</main>

<section>
  <div class = "bar">
    <span id = "ptitle">no file</span>
    <button
      id    = "askfile"
      title = "mention this file in your message"
    >ask about this file</button>

    <button
      id    = "closeviewer"
      class = "close"
      title = "hide the file viewer"
    >×</button>
  </div>
  <div id = "preview"><div class = "empty">PDFs, Markdown and code preview here.</div></div>
</section>

</body>
</html>
